<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Just Us</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💌</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Libre+Franklin:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FAF4F6;
    --surface: #FFFFFF;
    --mine: #7B4B94;
    --mine-text: #FFFFFF;
    --theirs: #F0E6EA;
    --theirs-text: #2C2233;
    --text: #2C2233;
    --muted: #8B7D91;
    --border: #EBDEE3;
    --input-bg: #FFFFFF;
    --accent-soft: #F1E4EC;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1B1522;
      --surface: #241B2E;
      --mine: #9A6BB5;
      --mine-text: #FFFFFF;
      --theirs: #33283C;
      --theirs-text: #F1E9EE;
      --text: #F1E9EE;
      --muted: #A899AE;
      --border: #3A2E45;
      --input-bg: #2B2136;
      --accent-soft: #362A41;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Libre Franklin', -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: calc(env(safe-area-inset-top, 0px) + 14px) 18px 14px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  .avatar { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, var(--mine), var(--theirs)); flex: 0 0 auto; display: flex; align-items: center; justify-content: center; font-size: 18px; }
  .header-text h1 { font-family: 'Fraunces', serif; font-weight: 600; font-size: 19px; margin: 0; line-height: 1.2; }
  .header-text p { margin: 2px 0 0; font-size: 12.5px; color: var(--muted); }
  .status-dot { width: 7px; height: 7px; border-radius: 50%; background: #6FBF73; display: inline-block; margin-right: 5px; }
  main { flex: 1 1 auto; overflow-y: auto; padding: 18px 14px 10px; display: flex; flex-direction: column; gap: 2px; }
  .day-divider { text-align: center; color: var(--muted); font-size: 12px; margin: 16px 0 10px; }
  .row { display: flex; margin: 3px 0; }
  .row.mine { justify-content: flex-end; }
  .row.theirs { justify-content: flex-start; }
  .bubble { max-width: min(78%, 460px); padding: 9px 13px; border-radius: 18px; font-size: 15px; line-height: 1.42; white-space: pre-wrap; word-wrap: break-word; }
  .row.mine .bubble { background: var(--mine); color: var(--mine-text); border-bottom-right-radius: 5px; }
  .row.theirs .bubble { background: var(--theirs); color: var(--theirs-text); border-bottom-left-radius: 5px; }
  .meta-line { font-size: 11px; color: var(--muted); margin: 2px 3px 8px; }
  .empty-state { margin: auto; text-align: center; color: var(--muted); padding: 40px 20px; max-width: 320px; }
  .empty-state .big { font-family: 'Fraunces', serif; font-size: 22px; color: var(--text); margin-bottom: 6px; }
  .banner { margin: 10px 14px; padding: 12px 14px; background: var(--accent-soft); border-radius: 12px; font-size: 13.5px; line-height: 1.45; }
  footer { flex: 0 0 auto; display: flex; align-items: flex-end; gap: 10px; padding: 10px 12px calc(env(safe-area-inset-bottom, 0px) + 10px); background: var(--surface); border-top: 1px solid var(--border); }
  textarea { flex: 1 1 auto; resize: none; border: 1px solid var(--border); background: var(--input-bg); color: var(--text); border-radius: 20px; padding: 10px 16px; font-family: inherit; font-size: 15px; line-height: 1.4; max-height: 110px; outline: none; }
  textarea:focus { border-color: var(--mine); }
  button.send { flex: 0 0 auto; width: 42px; height: 42px; border-radius: 50%; border: none; background: var(--mine); color: var(--mine-text); display: flex; align-items: center; justify-content: center; cursor: pointer; }
  button.send:disabled { opacity: 0.4; cursor: not-allowed; }
  button.send svg { width: 18px; height: 18px; }

  /* Name-picker modal */
  #name-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.45); display: flex; align-items: center; justify-content: center; z-index: 10; padding: 20px; }
  #name-modal .card { background: var(--surface); border-radius: 16px; padding: 26px 22px; max-width: 320px; width: 100%; text-align: center; }
  #name-modal h2 { font-family: 'Fraunces', serif; font-size: 20px; margin: 0 0 6px; }
  #name-modal p { color: var(--muted); font-size: 13.5px; margin: 0 0 16px; }
  #name-modal input { width: 100%; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--input-bg); color: var(--text); font-size: 15px; margin-bottom: 12px; }
  #name-modal button { width: 100%; padding: 10px; border-radius: 10px; border: none; background: var(--mine); color: var(--mine-text); font-size: 15px; cursor: pointer; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<div id="name-modal" class="hidden">
  <div class="card">
    <h2>Who's texting?</h2>
    <p>Just so your messages land on the right side. Only stored on this device.</p>
    <input id="name-input" type="text" placeholder="Your name" maxlength="24">
    <button id="name-save">Start chatting</button>
  </div>
</div>

<header>
  <div class="avatar">💌</div>
  <div class="header-text">
    <h1 id="header-title">Just Us</h1>
    <p id="header-sub"><span class="status-dot"></span>Connecting…</p>
  </div>
</header>

<main id="messages">
  <div class="empty-state" id="empty-state">
    <div class="big">Nothing here yet</div>
    <div>Say hello — this thread is just for the two of you.</div>
  </div>
</main>

<footer>
  <textarea id="input" placeholder="Type a message…" rows="1" disabled></textarea>
  <button class="send" id="send-btn" disabled aria-label="Send">
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M3 11.5L21 3L14.5 21L11 13L3 11.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
    </svg>
  </button>
</footer>

<!-- ============================================================ -->
<!-- Firebase (free tier). Fill in YOUR config below — see README. -->
<!-- ============================================================ -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script>
  const firebaseConfig = {
    apiKey: "PASTE_YOUR_API_KEY",
    authDomain: "PASTE_YOUR_PROJECT.firebaseapp.com",
    projectId: "PASTE_YOUR_PROJECT_ID",
    storageBucket: "PASTE_YOUR_PROJECT.appspot.com",
    messagingSenderId: "PASTE_YOUR_SENDER_ID",
    appId: "PASTE_YOUR_APP_ID"
  };

  // A private "room" so only people who know this code share a thread.
  // Change this to your own long random string before you publish the repo.
  const ROOM_ID = "change-me-to-a-long-random-code";
</script>
<script>
(function() {
  const MAX_MESSAGES = 300;
  const messagesEl = document.getElementById('messages');
  const emptyState = document.getElementById('empty-state');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send-btn');
  const headerSub = document.getElementById('header-sub');
  const headerTitle = document.getElementById('header-title');
  const nameModal = document.getElementById('name-modal');
  const nameInput = document.getElementById('name-input');
  const nameSave = document.getElementById('name-save');

  let myName = localStorage.getItem('justus_name') || '';
  let db = null;
  let unsub = null;
  let currentMessages = [];

  function setStatus(text, ok) {
    headerSub.innerHTML = '<span class="status-dot" style="background:' + (ok ? '#6FBF73' : '#C97B7B') + '"></span>' + text;
  }

  function autoGrow() {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 110) + 'px';
  }
  input.addEventListener('input', autoGrow);

  function formatTime(ts) {
    return new Date(ts).toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
  }
  function formatDay(ts) {
    const d = new Date(ts);
    const today = new Date();
    const yest = new Date(); yest.setDate(today.getDate() - 1);
    if (d.toDateString() === today.toDateString()) return 'Today';
    if (d.toDateString() === yest.toDateString()) return 'Yesterday';
    return d.toLocaleDateString(undefined, { month: 'long', day: 'numeric' });
  }

  function render() {
    const others = [...new Set(currentMessages.map(m => m.sender).filter(s => s && s !== myName))];
    headerTitle.textContent = others.length ? ('You & ' + others[0]) : 'Just Us';

    messagesEl.innerHTML = '';
    if (!currentMessages.length) {
      messagesEl.appendChild(emptyState);
      return;
    }
    let lastDay = null;
    currentMessages.forEach(m => {
      const day = formatDay(m.ts);
      if (day !== lastDay) {
        const div = document.createElement('div');
        div.className = 'day-divider';
        div.textContent = day;
        messagesEl.appendChild(div);
        lastDay = day;
      }
      const mine = m.sender === myName;
      const row = document.createElement('div');
      row.className = 'row ' + (mine ? 'mine' : 'theirs');
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = m.text;
      row.appendChild(bubble);
      messagesEl.appendChild(row);

      const meta = document.createElement('div');
      meta.className = 'meta-line';
      meta.style.textAlign = mine ? 'right' : 'left';
      meta.textContent = (mine ? 'You' : m.sender) + ' · ' + formatTime(m.ts);
      messagesEl.appendChild(meta);
    });
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function threadDoc() {
    return db.collection('rooms').doc(ROOM_ID);
  }

  async function sendMessage() {
    const text = input.value.trim();
    if (!text || !db) return;
    input.value = '';
    autoGrow();
    const msg = { text: text, sender: myName, ts: Date.now() };
    const next = [...currentMessages, msg].slice(-MAX_MESSAGES);
    currentMessages = next;
    render();
    try {
      await threadDoc().set({ messages: next });
    } catch (e) {
      setStatus('Message might not have sent — check your Firebase setup', false);
      console.error(e);
    }
  }

  sendBtn.addEventListener('click', sendMessage);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  function startListening() {
    input.disabled = false;
    sendBtn.disabled = false;
    unsub = threadDoc().onSnapshot((snap) => {
      const data = snap.exists ? snap.data() : null;
      currentMessages = (data && Array.isArray(data.messages)) ? data.messages : [];
      setStatus('Connected', true);
      render();
    }, (err) => {
      setStatus('Connection error — check your Firebase config & rules', false);
      console.error(err);
    });
  }

  function ensureName() {
    if (myName) return true;
    nameModal.classList.remove('hidden');
    return false;
  }
  nameSave.addEventListener('click', () => {
    const v = nameInput.value.trim();
    if (!v) return;
    myName = v;
    localStorage.setItem('justus_name', v);
    nameModal.classList.add('hidden');
    startListening();
  });

  function init() {
    if (firebaseConfig.apiKey.indexOf('PASTE_YOUR') === 0) {
      setStatus('Not set up yet', false);
      const banner = document.createElement('div');
      banner.className = 'banner';
      banner.textContent = 'This page needs your Firebase config filled in at the top of the file before it will work. See the README for setup steps.';
      messagesEl.innerHTML = '';
      messagesEl.appendChild(banner);
      return;
    }
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
    if (ensureName()) {
      startListening();
    }
  }

  init();
})();
</script>
</body>
</html>
